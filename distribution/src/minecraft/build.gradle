plugins { id 'net.fabricmc.fabric-loom' version '1.18.4' }
version = '0.2.6'
group = 'dev.slcraft'
base { archivesName = 'slcraft-minecraft-client' }
loom {
 splitEnvironmentSourceSets()
 mods { skycraft { sourceSet sourceSets.main; sourceSet sourceSets.client } }
 runs { client { vmArgs '--enable-native-access=ALL-UNNAMED', '-Dskycraft.quitWithSkyrim=true', '-Dskycraft.showWindow=false', '-Dskycraft.startHidden=true' } }
}
dependencies {
 minecraft 'com.mojang:minecraft:26.3'
 implementation 'net.fabricmc:fabric-loader:0.19.5'
 implementation 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.3'
 testImplementation platform('org.junit:junit-bom:5.11.4')
 testImplementation 'org.junit.jupiter:junit-jupiter'
 testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25; withSourcesJar() }
processResources {
 inputs.property('version', project.version)
 filesMatching('fabric.mod.json') { expand 'version': project.version }
}
test { useJUnitPlatform() }

